name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PostgreSQL 18 is the floor: uuidv7() and the builtin C.UTF-8 collation
  # provider both require it. See migrations/*_schema-conventions.sql.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atarimae_dev
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atarimae_test
  ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # ubuntu-latest currently ships pg_dump 16. The database service is 18,
      # and pg_dump deliberately refuses to dump a server newer than itself.
      # The HTTP backup tests exercise the real binary, so keep the client at
      # the same major version as production rather than mocking the boundary.
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - name: Generate .env
        run: node scripts/setup-env.mjs

      - name: Prepare databases
        run: |
          node scripts/db.mjs reset
          node scripts/db.mjs reset --test

      # Must precede lint and typecheck. Workspace packages expose their types
      # through dist/*.d.ts, and without them typescript-eslint reports every
      # cross-package import as "a type that cannot be resolved".
      - name: Build packages
        run: pnpm -r build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      # Proves every migration has a working Down Migration. A migration that
      # cannot be rolled back must never reach main.
      - name: Verify migrations are reversible
        run: node scripts/db.mjs verify

      # Fails the build on a known advisory rather than reporting one.
      #
      # `security.md` listed this as not done, and wiring it up found three on
      # the first run — two of them @fastify/static, which is what serves the
      # web interface. The direct dependency was already patched; the vulnerable
      # copy arrived through @fastify/swagger-ui, which is registered only
      # outside production but ships in the image regardless.
      #
      # A warning nobody has to act on is a warning nobody acts on, so this
      # blocks. When it fires for something with no patch available, the honest
      # answer is a documented `overrides` entry in pnpm-workspace.yaml or an
      # explicit decision recorded there — not a `|| true` on this line.
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      # The OpenAPI document is generated from the route schemas. If it drifts,
      # the committed document and the frontend client types are stale.
      - name: Check OpenAPI document is current
        run: |
          pnpm --filter @atarimae/server openapi
          if ! git diff --exit-code --stat apps/server/openapi.json; then
            echo "::error::openapi.json is out of date. Run: pnpm --filter @atarimae/server openapi"
            exit 1
          fi

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate .env
        run: node scripts/setup-env.mjs

      - name: Prepare test database
        run: node scripts/db.mjs reset --test

      - name: Build packages
        run: pnpm -r build

      - name: Install Playwright browsers
        run: pnpm --filter @atarimae/e2e exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  desktop:
    name: Windows desktop tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Test the Tauri shell
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate deployment configuration
        run: node scripts/setup-env.mjs

      # Exercise the public one-command path, not only `docker build`. The app
      # must apply migrations itself and become healthy without an operator
      # entering the container between those two events.
      - name: Start the production stack
        run: docker compose up -d --build

      - name: Verify automatic migrations and health
        run: |
          app_container="$(docker compose ps -q app)"
          test -n "$app_container"
          for attempt in {1..60}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$app_container")"
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' "$app_container")" = healthy
          docker compose exec -T app node scripts/db.mjs status | tee migration-status.txt
          grep -F "0 pending." migration-status.txt

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the production stack
        if: always()
        run: docker compose down --volumes
